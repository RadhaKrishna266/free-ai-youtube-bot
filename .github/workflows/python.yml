name: AI Video Bot

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # ================= CHECKOUT =================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================= SYSTEM TOOLS =================
      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      # ================= PYTHON =================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ================= DEPENDENCIES =================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts pydub

      # ================= RUN BOT =================
      - name: Run Video Bot
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python upload.py

      # ================= VERIFY OUTPUT =================
      - name: Verify video exists
        run: |
          ls -lh
          test -f final_video_episode_1.mp4

      # ================= UPLOAD ARTIFACT =================
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: viral-video
          path: final_video_episode_1.mp4