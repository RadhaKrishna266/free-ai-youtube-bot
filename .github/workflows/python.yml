name: AI Viral Shorts Bot

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # ================= CHECKOUT =================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================= INSTALL TOOLS =================
      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      # ================= SETUP PYTHON =================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ================= INSTALL PACKAGES =================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts pydub

      # ================= RUN BOT =================
      - name: Run video bot
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python upload.py

      # ================= VERIFY VIDEO =================
      - name: Verify video exists
        run: |
          echo "Files created:"
          ls -lh
          ls *.mp4

      # ================= UPLOAD ARTIFACT =================
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: viral-video
          path: "*.mp4"