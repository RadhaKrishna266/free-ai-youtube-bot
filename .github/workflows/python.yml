name: 🎬 Auto YouTube Shorts Bot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout repo
      - name: Checkout
        uses: actions/checkout@v3

      # 🐍 Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # ⚙️ System deps (IMPORTANT for MoviePy + MP3)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 📦 Python deps
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install moviepy==1.0.3 gTTS numpy requests imageio imageio-ffmpeg edge-tts pillow

      # 🚀 Run script
      - name: Run upload.py
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: python upload.py

      # 📂 Debug output
      - name: List files
        run: ls -R

      # 📤 Upload video
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts
          path: output/final.mp4