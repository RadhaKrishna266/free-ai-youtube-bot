name: AI Viral Study Bot

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Install system tools
      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      # ✅ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ Install ALL required packages
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow edge-tts pydub requests

      # ✅ Run your bot
      - name: Run video bot
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python upload.py

      # ✅ Verify video
      - name: Check video
        run: |
          ls -lh
          ls *.mp4

      # ✅ Upload artifact
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: study-video
          path: "*.mp4"