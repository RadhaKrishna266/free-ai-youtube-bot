name: AI Viral Shorts Bot

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install system tools
      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dependencies
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts pydub

      # Run bot
      - name: Run video bot
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python main.py

      # Check generated video
      - name: Verify video exists
        run: |
          ls -lh
          ls *.mp4

      # Upload video artifact
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: viral-video
          path: "*.mp4"